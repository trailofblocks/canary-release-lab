apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      scrape_timeout: 1s
    scrape_configs:
      - job_name: checkout-traffic
        static_configs:
          - targets: ["traffic-generator:8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: canary-prometheus
  ports:
    - port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-prometheus
  template:
    metadata:
      labels:
        app: canary-prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          args:
            - --config.file=/config/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 80Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-generator
spec:
  selector:
    app: checkout-load
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-load
  template:
    metadata:
      labels:
        app: checkout-load
    spec:
      automountServiceAccountToken: false
      containers:
        - name: generator
          image: canary-release-lab:local
          imagePullPolicy: Never
          args: ["load"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 35m, memory: 24Mi}
            limits: {memory: 128Mi}
